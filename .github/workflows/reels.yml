name: Make and upload reels

on:
  schedule:
    - cron: "30 3 * * *"        # 09:00 IST every day (GitHub cron is UTC). Change to taste.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no APIs, no upload)"
        type: boolean
        default: false

permissions:
  contents: write                # lets the job save data/history.json back to the repo

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make and upload reels
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}        # only if provider: anthropic
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}    # only if images provider: replicate
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m reelbot run --dry-run
          else
            python -m reelbot run
          fi

      - name: Keep the videos for 3 days (so you can check them)
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Save history (so topics don't repeat)
        run: |
          git config user.name "reelbot"
          git config user.email "reelbot@users.noreply.github.com"
          git add data/history.json data/image_usage.json || git add data/history.json
          git diff --staged --quiet || (git commit -m "Update reel history" && git push)
